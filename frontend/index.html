<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wissens-Chatbot</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --border: #dde3ea;
    --text: #1c2733; --muted: #5b6b7c; --accent: #0f5cbf; --accent-soft: #e8f0fb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { background: var(--card); border-bottom: 1px solid var(--border);
           padding: 0.8rem 1.2rem; display: flex; align-items: center; gap: 0.8rem; }
  header h1 { font-size: 1.05rem; margin: 0; }
  header .spacer { flex: 1; }
  header .user { color: var(--muted); font-size: 0.85rem; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
           padding: 0.55rem 1rem; font-size: 0.95rem; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); }
  main { flex: 1; overflow-y: auto; padding: 1.2rem; }
  .wrap { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 0.9rem; }
  .msg { padding: 0.8rem 1rem; border-radius: 12px; line-height: 1.5; white-space: pre-wrap;
         border: 1px solid var(--border); }
  .msg.user { background: var(--accent-soft); align-self: flex-end; max-width: 85%; }
  .msg.bot  { background: var(--card); align-self: flex-start; max-width: 95%; }
  .quellen { margin-top: 0.6rem; font-size: 0.82rem; color: var(--muted); }
  .quellen b { color: var(--text); }
  .quelle { border-top: 1px dashed var(--border); padding-top: 0.4rem; margin-top: 0.4rem;
            display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .quelle a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .quelle a:hover { text-decoration: underline; }
  .quelle button.klein { background: transparent; color: var(--accent);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 0.1rem 0.5rem; font-size: 0.78rem; }
  .kontakt { margin-top: 0.5rem; font-size: 0.85rem; background: var(--accent-soft);
             border-radius: 8px; padding: 0.5rem 0.7rem; }
  footer { background: var(--card); border-top: 1px solid var(--border); padding: 0.9rem 1.2rem; }
  form.chat { max-width: 780px; margin: 0 auto; display: flex; gap: 0.6rem; }
  input[type=text], input[type=password] { flex: 1; border: 1px solid var(--border);
    border-radius: 8px; padding: 0.6rem 0.8rem; font-size: 1rem; background: var(--card); }
  /* Login */
  #login { position: fixed; inset: 0; background: var(--bg); display: flex;
           align-items: center; justify-content: center; }
  /* Wichtig: 'display: flex' auf #login ist spezifischer als die Browser-Regel
     '[hidden] { display: none }' – ohne diese Zeile bliebe das Login-Overlay
     nach erfolgreicher Anmeldung sichtbar. */
  #login[hidden] { display: none; }
  #login .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
                 padding: 2rem; width: 340px; display: flex; flex-direction: column; gap: 0.8rem; }
  #login h2 { margin: 0 0 0.4rem; font-size: 1.1rem; }
  #login .hinweis { font-size: 0.78rem; color: var(--muted); }
  .fehler { color: #b3261e; font-size: 0.85rem; min-height: 1.2em; }
</style>
</head>
<body>

<div id="login">
  <form class="card" id="loginForm">
    <h2 id="loginTitel">Wissens-Chatbot – Anmeldung</h2>
    <input type="text" id="username" placeholder="Benutzername" autocomplete="username" required>
    <input type="password" id="password" placeholder="Passwort" autocomplete="current-password" required>
    <div class="fehler" id="loginFehler"></div>
    <button type="submit">Anmelden</button>
    <div class="hinweis">Demo-Zugänge: admin/admin123 · mmuster/demo123 · gast/gast123</div>
  </form>
</div>

<header hidden id="kopf">
  <h1 id="firmenname">Wissens-Chatbot</h1>
  <div class="spacer"></div>
  <span class="user" id="userInfo"></span>
  <button class="secondary" id="logout">Abmelden</button>
</header>

<main hidden id="verlaufContainer"><div class="wrap" id="verlauf">
  <div class="msg bot">Hallo! Ich beantworte Fragen auf Basis der internen Wissensdatenbank
und finde Dokumente und Ansprechpartner für Sie. Was möchten Sie wissen?</div>
</div></main>

<footer hidden id="fuss">
  <form class="chat" id="chatForm">
    <input type="text" id="frage" placeholder="Frage stellen, z. B. „Wie beantrage ich Urlaub?“" autocomplete="off">
    <button type="submit">Senden</button>
  </form>
</footer>

<script>
// Seitenspeicher kann durch Browser-Einstellungen blockiert sein (SecurityError).
// Die Anmeldung muss auch dann funktionieren – Speicher ist nur Komfort
// (eingeloggt bleiben beim Neuladen), deshalb alle Zugriffe abgesichert.
function speicherLies(key) {
  try { return sessionStorage.getItem(key); } catch (e) { return null; }
}
function speicherSchreib(key, value) {
  try { sessionStorage.setItem(key, value); } catch (e) { /* ohne Speicher weiter */ }
}
function speicherLeeren() {
  try { sessionStorage.clear(); } catch (e) { /* ohne Speicher weiter */ }
}

let token = speicherLies("token") || "";

const $ = (id) => document.getElementById(id);

function zeigeApp(anzeigename, gruppen) {
  $("login").hidden = true;
  $("kopf").hidden = false;
  $("verlaufContainer").hidden = false;
  $("fuss").hidden = false;
  $("userInfo").textContent = gruppen.length
    ? anzeigename + " · Gruppen: " + gruppen.join(", ")
    : anzeigename;
}

function authHeaders() {
  return token ? { "Authorization": "Bearer " + token } : {};
}

$("loginForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  $("loginFehler").textContent = "";
  try {
    const r = await fetch("/api/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("username").value, password: $("password").value }),
    });
    if (!r.ok) { $("loginFehler").textContent = "Benutzername oder Passwort falsch."; return; }
    const d = await r.json();
    token = d.token;
    speicherSchreib("token", token);
    speicherSchreib("anzeigename", d.anzeigename);
    speicherSchreib("gruppen", JSON.stringify(d.gruppen));
    zeigeApp(d.anzeigename, d.gruppen);
  } catch (e) {
    // Fehler sichtbar machen statt still zu scheitern
    console.error("Anmeldefehler:", e);
    $("loginFehler").textContent = "Technischer Fehler beim Anmelden: " + e.message;
  }
});

$("logout").addEventListener("click", () => { speicherLeeren(); location.reload(); });

// Gesprächsverlauf für Rückfragen ("und wer ist dafür zuständig?").
// Wird mit jeder Frage an den Server geschickt; ausgewertet wird er von
// LLM-Providern (Ollama / EU-Endpunkt), der extraktive Modus ignoriert ihn.
const verlauf = [];

async function oeffneDokument(name, titel) {
  try {
    const r = await fetch("/api/documents/file?name=" + encodeURIComponent(name),
                          { headers: authHeaders() });
    if (!r.ok) { alert("Dokument konnte nicht geladen werden (" + r.status + ")."); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    // PDF/Text zeigt der Browser direkt an; Office-Dateien werden heruntergeladen.
    const endung = name.split(".").pop().toLowerCase();
    if (["pdf", "txt", "md"].includes(endung)) {
      window.open(url, "_blank");
    } else {
      const a = document.createElement("a");
      a.href = url;
      a.download = name.split("/").pop();
      a.click();
    }
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) {
    alert("Fehler beim Öffnen: " + e.message);
  }
}

function kopierePfad(pfad, knopf) {
  const ok = () => { knopf.textContent = "✓ kopiert"; setTimeout(() => knopf.textContent = "Pfad kopieren", 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(pfad).then(ok).catch(() => window.prompt("Pfad manuell kopieren:", pfad));
  } else {
    window.prompt("Pfad manuell kopieren:", pfad);
  }
}

function nachricht(text, wer) {
  const div = document.createElement("div");
  div.className = "msg " + wer;
  div.textContent = text;
  $("verlauf").appendChild(div);
  div.scrollIntoView({ behavior: "smooth" });
  return div;
}

$("chatForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const frage = $("frage").value.trim();
  if (!frage) return;
  $("frage").value = "";
  nachricht(frage, "user");
  const laden = nachricht("Suche in der Wissensdatenbank …", "bot");
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: Object.assign({ "Content-Type": "application/json" }, authHeaders()),
      body: JSON.stringify({ frage, verlauf }),
    });
    if (r.status === 401) { speicherLeeren(); location.reload(); return; }
    const d = await r.json();
    laden.textContent = d.antwort;
    verlauf.push({ rolle: "nutzer", text: frage });
    verlauf.push({ rolle: "bot", text: d.antwort });
    if (d.quellen && d.quellen.length) {
      const q = document.createElement("div");
      q.className = "quellen";
      q.innerHTML = "<b>Quellen (anklicken zum Öffnen):</b>";
      for (const s of d.quellen) {
        const e = document.createElement("div");
        e.className = "quelle";
        const link = document.createElement("a");
        link.href = "#";
        link.textContent = "📄 " + s.titel;
        link.title = s.dokument;
        link.addEventListener("click", (ev2) => { ev2.preventDefault(); oeffneDokument(s.dokument, s.titel); });
        const info = document.createElement("span");
        info.textContent = "(" + s.dokument + " · Gruppe: " + s.gruppe + ")";
        const knopf = document.createElement("button");
        knopf.type = "button";
        knopf.className = "klein";
        knopf.textContent = "Pfad kopieren";
        knopf.addEventListener("click", () => kopierePfad(s.pfad, knopf));
        e.append(link, info, knopf);
        q.appendChild(e);
      }
      laden.appendChild(q);
    }
    if (d.ansprechpartner && d.ansprechpartner.length) {
      for (const a of d.ansprechpartner) {
        const k = document.createElement("div");
        k.className = "kontakt";
        k.textContent = "Ansprechpartner " + a.bereich + ": " + a.name +
          (a.email ? " · " + a.email : "") + (a.telefon ? " · " + a.telefon : "");
        laden.appendChild(k);
      }
    }
  } catch (e) {
    laden.textContent = "Fehler: Server nicht erreichbar.";
  }
});

// Startablauf: Modus vom Server holen. Im Privat-Modus (lokale Nutzung
// eigener Dokumente) gibt es keinen Login – direkt loslegen.
(async () => {
  try {
    const r = await fetch("/api/health");
    const d = await r.json();
    $("firmenname").textContent = "Wissens-Chatbot – " + d.unternehmen;
    if (d.modus === "privat") {
      $("logout").hidden = true;
      zeigeApp("Privater Modus – alle eigenen Dokumente (" + (d.chunks ?? 0) + " Abschnitte indiziert)", []);
      return;
    }
  } catch (e) { /* Server noch nicht erreichbar – Login anzeigen */ }
  if (token) {
    let gruppen = [];
    try { gruppen = JSON.parse(speicherLies("gruppen") || "[]"); } catch (e) {}
    zeigeApp(speicherLies("anzeigename") || "", gruppen);
  }
})();
</script>
</body>
</html>
